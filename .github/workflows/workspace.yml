name: Workspace checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  workspace:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.8'
      - name: Install validator dependency
        run: python -m pip install -r tools/requirements-check.txt
      - name: Validate docs, configuration, hygiene and utility behavior
        run: make check
      - name: Inventory runtime (not FPGA validation)
        run: make doctor
